
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="./assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<title>New Tab</title>

<link rel="stylesheet" href="./styles.css">
</head>

<body>

<main class="container">

  <section class="dashboard" aria-label="Time and weather">
    <div class="clock-block">
      <time class="clock" id="clock" aria-label="Current time">
        <span id="clockHour"></span>
        <span class="clock-minute-row">
          <span id="clockMinute"></span>
          <span class="clock-period" id="clockPeriod">AM</span>
        </span>
      </time>
      <div class="world-times" aria-label="GMT and Texas times">
        <span>GMT <strong id="gmtTime">--:--</strong></span>
        <span>Texas <strong id="texasTime">--:--</strong></span>
      </div>
    </div>
    <div class="weather" id="weather" role="button" tabindex="0" title="Click to update weather" aria-label="Update weather" aria-live="polite">
      <div class="weather-details">
        <div class="weather-current">
          <span class="weather-icon" id="weatherIcon" aria-hidden="true">☁</span>
          <span class="weather-temperature" id="weatherTemperature">--°</span>
          <span class="weather-condition" id="weatherCondition">Loading weather</span>
          <span class="weather-location" id="weatherLocation">Location not set</span>
        </div>
        <div class="weather-meta">
          <span>Feels<strong id="weatherFeels">--</strong></span>
          <span>Humidity<strong id="weatherHumidity">--</strong></span>
          <span>Wind<strong id="weatherWind">--</strong></span>
        </div>
        <div class="weather-meta weather-extremes">
          <span>High<strong id="weatherHigh">--</strong></span>
          <span>Low<strong id="weatherLow">--</strong></span>
          <span>Rain<strong id="weatherRain">--</strong></span>
        </div>
      </div>
    </div>
  </section>

  <div class="agent-blur" id="agentBlur" aria-hidden="true"></div>

  <div class="search-row">
    <div class="search-mode" role="group" aria-label="Search mode">
      <button class="search-mode-option is-active" type="button" data-mode="search" aria-label="Search" title="Search" aria-pressed="true">
        <svg class="mode-icon google-mode-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#4285F4" d="M23.49 12.27c0-.78-.07-1.53-.2-2.27H12v4.51h6.44a5.5 5.5 0 0 1-2.39 3.61v3h3.87c2.27-2.09 3.57-5.17 3.57-8.85Z"/>
          <path fill="#34A853" d="M12 24c3.24 0 5.96-1.08 7.95-2.88l-3.87-3c-1.08.72-2.46 1.15-4.08 1.15-3.13 0-5.78-2.11-6.73-4.95H1.27v3.09A12 12 0 0 0 12 24Z"/>
          <path fill="#FBBC05" d="M5.27 14.32a7.2 7.2 0 0 1 0-4.64V6.59H1.27a12 12 0 0 0 0 10.82l4-3.09Z"/>
          <path fill="#EA4335" d="M12 4.73c1.77 0 3.35.61 4.6 1.81l3.44-3.44C17.95 1.16 15.24 0 12 0A12 12 0 0 0 1.27 6.59l4 3.09c.95-2.84 3.6-4.95 6.73-4.95Z"/>
        </svg>
      </button>
      <button class="search-mode-option" type="button" data-mode="agent" aria-label="Agent" title="Agent" aria-pressed="false">
        <img class="mode-icon agent-mode-icon" src="./assests/" alt="">
      </button>
    </div>
    <form class="search" id="searchForm">
      <input
        id="query"
        type="text"
        placeholder="Search..."
        autocomplete="off"
        autofocus
      >
    </form>
  </div>

  <section class="agent-response" id="agentResponse" aria-live="polite" hidden></section>

  <div class="shortcuts" id="shortcuts" aria-label="Shortcuts"></div>

  <dialog class="shortcut-dialog" id="shortcutDialog" aria-labelledby="shortcutDialogTitle">
    <form id="shortcutForm">
      <div class="shortcut-dialog-header">
        <img class="shortcut-dialog-icon" id="shortcutDialogIcon" alt="" hidden>
        <h2 id="shortcutDialogTitle">Add</h2>
      </div>
      <label for="shortcutName">Name</label>
      <input id="shortcutName" name="name" required maxlength="32" autocomplete="off">
      <label for="shortcutUrl">Website URL</label>
      <input id="shortcutUrl" name="url" type="url" required placeholder="https://example.com" autocomplete="url">
      <div class="dialog-actions">
        <button type="button" id="cancelShortcut">Cancel</button>
        <button type="submit">Save</button>
      </div>
    </form>
  </dialog>

</main>

<script src="./script.js"></script>

</body>
</html>
